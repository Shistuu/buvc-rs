[package]
name = "buvc-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-bls12-381 = "0.4"
ark-serialize = "0.4"

ethers-core = { version = "2" }
ethers-providers = { version = "2", features = ["ipc"] }
ethers-contract = { version = "2", features = ["abigen"] }
ethers-middleware = { version = "2" }

base64ct = "=1.6.0"

eyre = "0.6"
color-eyre = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rayon = "1.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }

[workspace]
members = ["."]

[features]
default = ["parallel"]

parallel = [
    "ark-std/parallel",
    "ark-ff/parallel",
    "ark-ec/parallel",
]
